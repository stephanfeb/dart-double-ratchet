name: double_ratchet
description: >-
  The Signal protocol's X3DH key agreement and Double Ratchet in pure Dart:
  end-to-end encrypted sessions with forward secrecy and post-compromise
  security, following the published Signal specifications.
version: 0.2.0
repository: https://github.com/stephanfeb/dart-double-ratchet
issue_tracker: https://github.com/stephanfeb/dart-double-ratchet/issues
topics: [cryptography, encryption, signal, e2ee, messaging]

environment:
  sdk: ^3.5.0

dependencies:
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
